<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oversized Graphic Tees - Velzorix</title>
    <style>
        :root { --blue: #00a8e1; --bg: #e3e6e6; --card: #fff; --text: #0f1111; --muted: #565959; --header: #131921; }
        [data-theme="dark"] { --bg: #0f1111; --card: #1a1a1a; --text: #fff; --muted: #aaa; --header: #000; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .header { background: var(--header); padding: 10px 20px; position: sticky; top: 0; z-index: 100; }
        .header-top { display: flex; align-items: center; gap: 20px; max-width: 1400px; margin: 0 auto; }
        .header-logo { color: #fff; font-size: 24px; font-weight: bold; text-decoration: none; }
        .header-logo span { color: var(--blue); }
        .header-right { display: flex; gap: 15px; align-items: center; color: #fff; font-size: 13px; margin-left: auto; }
        .theme-toggle { background: none; border: 1px solid #fff; color: #fff; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .back-btn { color: #007185; text-decoration: none; font-size: 14px; margin-bottom: 20px; display: inline-block; }
        .back-btn:hover { text-decoration: underline; color: #C7511F; }
        .product-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; background: var(--card); padding: 30px; border-radius: 8px; }
        .product-img { width: 100%; border-radius: 8px; }
        .product-title { font-size: 24px; font-weight: 400; margin-bottom: 10px; }
        .rating { display: flex; align-items: center; gap: 6px; margin-bottom: 15px; }
        .stars { color: #ffa41c; font-size: 16px; }
        .rating-count { color: #007185; font-size: 14px; }
        .price { font-size: 28px; color: #B12704; margin: 15px 0; }
        .delivery { color: #007600; font-size: 14px; margin: 15px 0; }
        .desc { font-size: 15px; line-height: 1.6; margin: 20px 0; color: var(--text); }
        .option-group { margin: 20px 0; }
        .option-label { font-weight: bold; margin-bottom: 8px; display: block; font-size: 14px; }
        .option-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .option-btn { padding: 8px 16px; border: 1px solid #d5d9d9; background: var(--card); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 14px; }
        .option-btn:hover, .option-btn.selected { border-color: var(--blue); background: #f0f8ff; }
        [data-theme="dark"] .option-btn.selected { background: #1a3a4a; }
        .qty-select { padding: 8px; border: 1px solid #d5d9d9; border-radius: 8px; font-size: 14px; background: var(--card); color: var(--text); }
        .whatsapp-btn { background: #25D366; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        .whatsapp-btn:hover { background: #1da851; }
        @media(max-width: 768px) { .product-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-top">
            <a href="index.html" class="header-logo">VELZORI<span>X</span></a>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
                <a href="https://wa.me/256778003397" style="color:#fff;text-decoration:none;">
                    <div>Order on</div>
                    <div><b>WhatsApp</b></div>
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <a href="index.html" class="back-btn">← Back to products</a>
